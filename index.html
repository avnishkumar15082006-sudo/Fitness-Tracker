<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Fitness Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Daily Fitness Tracker</h1>
    <p>Track your steps, workouts, and daily calorie burn</p>
  </header>

  <main>
    <!-- 1. Summary & Progress Section -->
    <section id="summary-section">
      <div class="card">
        <h2>Steps Today</h2>
        <p id="steps-display">0 / 10,000</p>
        <div class="progress-bar">
          <div id="steps-fill"></div>
        </div>
      </div>

      <div class="card">
        <h2>Calories Burned</h2>
        <p id="calories-display">0 / 500 kcal</p>
        <div class="progress-bar">
          <div id="calories-fill"></div>
        </div>
      </div>

      <div class="card">
        <h2>Workout Minutes</h2>
        <p id="minutes-display">0 mins</p>
      </div>
    </section>

    <!-- 2. Log Activity Form -->
    <section id="form-section">
      <h2>Log an Activity</h2>
      <form id="activity-form">
        <label for="activity-type">Activity</label>
        <select id="activity-type" required>
          <option value="Walking">Walking</option>
          <option value="Running">Running</option>
          <option value="Strength Training">Strength Training</option>
          <option value="Cycling">Cycling</option>
        </select>

        <label for="steps-input">Steps (0 if non-step workout)</label>
        <input type="number" id="steps-input" min="0" value="0" required />

        <label for="minutes-input">Duration (minutes)</label>
        <input type="number" id="minutes-input" min="1" placeholder="e.g. 30" required />

        <label for="calories-input">Calories Burned (kcal)</label>
        <input type="number" id="calories-input" min="1" placeholder="e.g. 200" required />

        <button type="submit">Add Activity</button>
      </form>
    </section>

    <!-- 3. Logged Activities List -->
    <section id="history-section">
      <h2>Activity Log</h2>
      <button type="button" id="reset-btn">Clear All</button>
      <ul id="activity-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
